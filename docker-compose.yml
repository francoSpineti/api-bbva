version: '3.8'

services:

  mysql:
    image: mysql:8.0

    container_name: bank-mysql

    restart: always

    environment:
      MYSQL_DATABASE: bankdb
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: bank
      MYSQL_PASSWORD: bank123

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: